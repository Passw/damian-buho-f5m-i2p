---
name: ${M6E_COMPOSE_PROJECT_NAME}
services:
  f5m-i2p:
    container_name: ${M6E_CONTAINER_INSTANCE}
    image: ${M6E_IMAGE_FULLNAME}
    # Preset: xlarge (4.0c, 8g) — interactive dev shell. Bounded so it can't starve the shared host.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
    environment:
      - LANG
      - TZ
      - B19_VERBOSITY=debug
      - F5M_I2P_EEPSITE_ENABLED=true
      - F5M_I2P_MIRROR_TARGET=traefik:80
    labels:
      com.docker.compose.watch: "true"
    networks:
      - dev-network
      - traefik-network
    secrets:
      - source: site-eepsite-key
        # 200-prepare-eepsites.sh reads the site key at /run/secrets/f5m.i2p.site-eepsite-key; without this mapping it lands at /run/secrets/site-eepsite-key and a throwaway identity is minted instead
        target: f5m.i2p.site-eepsite-key
    volumes:
      # Persist the router dir: netDb, router identity (router.keys.dat) and the addressbook live there, so a recreate without it re-bootstraps the router from zero.
      - i2p-netdb:/app/.i2p
      # Persist the eepsite identities (one <site>.dat per mirrors.d site, plus the env-driven eepPriv.dat) and the JVM tmp dir.
      - i2p-data:/app/data
      # One file per eepsite, the same directory f5m/tor reads its onion mirrors from
      - ./mirrors.d:/app/config/mirrors.d:ro
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:size=64m
networks:
  dev-network:
    name: ${M6E_NETWORK}
    external: true
  traefik-network:
    name: traefik-network
    external: true
secrets:
  site-eepsite-key:
    file: ${M6E_SECRETS_DIR:-.secrets}/f5m/i2p/site-eepsite-key
volumes:
  i2p-netdb: null
  i2p-data: null
