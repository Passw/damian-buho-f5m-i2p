# One eepsite per file: the filename is the site name (tunnel
# i2ptunnel.config.d/<site>.config, key secret f5m.i2p.<site>-eepsite-key) and
# the optional target= is where the eepsite forwards. Empty takes
# F5M_I2P_MIRROR_TARGET.
target=traefik:80
